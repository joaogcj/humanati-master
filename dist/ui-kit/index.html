<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Humanati UI Kit</title>
  <link rel="stylesheet" href="ui-kit.css">
  <style>
    body { margin: 0; padding: 32px; background: #0a0f1c; color: #f8fafc; font-family: system-ui; }
    main { max-width: 1120px; margin: auto; }
    section { margin: 32px 0; }
    h1 { font-size: 40px; }
    h2 { color: #37c6ff; }
  </style>
</head>
<body>
  <main>
    <p class="hu-card__eyebrow">Humanati Design System</p>
    <h1>UI Kit</h1>
    <section>
      <h2>Ações</h2>
      <div class="hu-cluster">
        <button class="hu-button hu-button--primary">Continuar</button>
        <button class="hu-button hu-button--secondary">Visualizar</button>
        <button class="hu-button hu-button--ghost">Cancelar</button>
      </div>
    </section>
    <section>
      <h2>Formulário</h2>
      <div class="hu-grid">
        <label class="hu-field">Nome<input class="hu-input" placeholder="Nome completo"><small class="hu-help">Como devemos chamar você?</small></label>
        <label class="hu-field">Área<select class="hu-select"><option>Operações</option><option>Estratégia</option></select></label>
      </div>
    </section>
    <section>
      <h2>Estados</h2>
      <div class="hu-cluster">
        <span class="hu-badge hu-badge--success">Operacional</span>
        <span class="hu-badge hu-badge--warning">Atenção</span>
        <span class="hu-badge hu-badge--danger">Crítico</span>
      </div>
    </section>
    <section class="hu-grid">
      <article class="hu-card">
        <p class="hu-card__eyebrow">Indicador</p>
        <h3 class="hu-card__title">Performance sustentável</h3>
        <p class="hu-card__body">Componentes consistentes para experiências Humanati.</p>
      </article>
      <div class="hu-alert"><strong>i</strong><div>Este kit atende foco visível e movimento reduzido.</div></div>
    </section>
  </main>
</body>
</html>
