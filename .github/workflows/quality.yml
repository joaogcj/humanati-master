name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook
      - uses: actions/upload-artifact@v4
        with:
          name: humanati-build
          path: |
            dist/
            storybook-static/
          if-no-files-found: error
          retention-days: 14

  container:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: humanati/ecosystem:${{ github.sha }}
